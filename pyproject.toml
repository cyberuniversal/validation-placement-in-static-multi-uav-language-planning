[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "validation-placement-multiuav"
version = "1.0.0"
description = "Reproducible validation-placement study for static multi-UAV language planning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=1.24,<3",
]

[project.optional-dependencies]
inference = [
    "accelerate>=0.33,<2",
    "huggingface-hub>=0.26,<1",
    "nvidia-ml-py>=13.595,<14",
    "psutil>=5.9,<8",
    "safetensors>=0.4,<1",
    "torch>=2.2,<3",
    "transformers>=4.45,<5",
]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
    "shapely==2.1.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
# This file is hash-bound by the frozen runner and hardware audits.
"src/shepherd_ai/multiuav_resources.py" = ["E731"]
