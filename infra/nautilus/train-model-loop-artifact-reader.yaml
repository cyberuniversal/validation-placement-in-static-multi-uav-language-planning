apiVersion: v1
kind: Pod
metadata:
  name: validation-placement-train-model-loop-artifact-reader
  namespace: aiea-interns
  labels:
    app.kubernetes.io/name: validation-placement
    validation-placement/stage: train-model-loop-artifact-reader
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: ry-gpu-15.sdsc.optiputer.net
  containers:
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 128Mi
      volumeMounts:
        - name: workspace
          mountPath: /workspace
          readOnly: true
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: shepherd-ai-539948
        readOnly: true
