apiVersion: batch/v1
kind: Job
metadata:
  name: validation-placement-train-pilot-3b-v2-a2
  namespace: aiea-interns
  labels:
    app.kubernetes.io/name: validation-placement
    validation-placement/stage: train-pilot-3b-v2-a2
spec:
  activeDeadlineSeconds: 7200
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: validation-placement
        validation-placement/stage: train-pilot-3b-v2-a2
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 120
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-GeForce-RTX-4090
                      - NVIDIA-RTX-A5000
                      - NVIDIA-A10
                      - NVIDIA-L4
                      - Tesla-T4
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-GeForce-RTX-3090
      containers:
        - name: train-pilot
          image: pytorch/pytorch:2.7.1-cuda11.8-cudnn9-runtime
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends git ca-certificates
              rm -rf /var/lib/apt/lists/*
              repo=/workspace/repo-validation-placement-993d7c2
              if [[ ! -d "${repo}/.git" ]]; then
                git clone https://github.com/cyberuniversal/validation-placement-in-static-multi-uav-language-planning.git "${repo}"
              fi
              git -C "${repo}" fetch origin codex/executable-fidelity-v2
              git -C "${repo}" checkout --detach 993d7c2a01e9ea38d9dd3332b43bb99d3f5707ee
              python -m pip install --no-cache-dir -e "${repo}[inference]"
              mkdir -p /workspace/results/train-pilot-v2/3b
              python "${repo}/scripts/run_multiuav_train_pilot_v2.py" \
                --results /workspace/results/train-pilot-v2/3b/raw_results.jsonl \
                --summary /workspace/results/train-pilot-v2/3b/run_summary.json \
                --cache-audit /workspace/artifacts/qwen25_3b_cache_audit_nautilus_v1.json
          env:
            - name: HF_HOME
              value: /workspace/hf-cache
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
          resources:
            requests:
              cpu: "2"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: 16Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: shepherd-ai-539948
