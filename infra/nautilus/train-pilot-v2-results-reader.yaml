apiVersion: v1
kind: Pod
metadata:
  name: validation-placement-train-pilot-v2-results-reader
  namespace: aiea-interns
  labels:
    app.kubernetes.io/name: validation-placement
    validation-placement/stage: train-pilot-v2-results-reader
spec:
  restartPolicy: Never
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - hcc-nrp-shor-c5917.unl.edu
  containers:
    - name: reader
      image: alpine:3.20
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      volumeMounts:
        - name: workspace
          mountPath: /workspace
          readOnly: true
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: shepherd-ai-539948
        readOnly: true
